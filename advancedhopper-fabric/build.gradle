plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

base { archivesName = 'advancedhopper' }

loom {
    splitEnvironmentSourceSets()
    mods {
        "advancedhopper" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

def nightConfigVersion = '3.8.4'

repositories {
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases/'
        content { includeGroup 'com.terraformersmc' }
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven/'
        content { includeModule 'maven.modrinth', 'jade' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    implementation "com.electronwill.night-config:toml:${nightConfigVersion}"
    include "com.electronwill.night-config:toml:${nightConfigVersion}"
    include "com.electronwill.night-config:core:${nightConfigVersion}"
    clientCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    compileOnly "maven.modrinth:jade:${project.jade_version}"
}

def modVersion = project.version.toString()

processResources {
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand 'version': modVersion
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
